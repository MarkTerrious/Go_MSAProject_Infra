apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Values.waypoint.namespace }}
  annotations:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    protocol: HBONE
    port: 15008