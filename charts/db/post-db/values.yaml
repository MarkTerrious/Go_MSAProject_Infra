post-db:
  auth:
    enablePostgresUser: true
    # 로컬 kind 클러스터 전용 더미 값입니다. 운영 환경에서는 별도 Secret/values-prod.yaml로 관리합니다.
    postgresPassword: "superpassword"
    username: "postgresql"
    password: "password"
    database: "gomsa"
  primary:
    persistence:
      enabled: false
    service:
      ports:
        postgresql: 5432
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    networkPolicy:
      # ambient mesh의 ztunnel-ztunnel HBONE 터널 포트. 이게 막히면 mTLS 터널 자체가 안 맺어짐.
      # 접근 주체 제한은 AuthorizationPolicy(principals)가 담당하므로 여기선 포트만 열어준다.
      extraIngress:
        - ports:
            - port: 15008
              protocol: TCP
imagePullSecrets:
  - name: ghcr-creds
serviceAccount:
  migration: post-db-migration