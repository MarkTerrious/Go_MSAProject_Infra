apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: {{ .Values.repo }}
        revision: main
        files:
          - path: "charts/gateway/*/values.yaml"
  template:
    metadata:
      name: "{{ `{{path.basename}}` }}"
    spec:
      project: {{ .Values.appProjectName.infra }}
      source:
        repoURL: {{ .Values.repo }}
        targetRevision: main
        path: "{{ `{{path}}` }}"
      destination:
        server: {{ .Values.curCluster }}
        namespace: "{{ `{{namespace}}` }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: {{ .Values.syncRetry.limit }}
          backoff:
            duration: {{ .Values.syncRetry.backoffDuration }}
            factor: {{ .Values.syncRetry.backoffFactor }}
            maxDuration: {{ .Values.syncRetry.backoffMaxDuration }}
