# charts/db/ 밑의 폴더(auth-db, post-db, ...)를 자동 스캔.
# DB는 auth/post와 다른 네임스페이스(default-db)에 떠 있어서 destination만 다름.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "db-%s" .Values.deploy_env | trimSuffix "-" }}
  labels:
    {{- include "argo-resource.labels" . | nindent 4 }}
spec:
  # finalizers 비활성화 
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: {{ .Values.repo }}
        revision: main
        directories:
          - path: charts/db/*
        allowEmpty: false
  template:
    metadata:
      name: "{{ `{{path.basename}}` }}{{ if .Values.deploy_env }}-{{ .Values.deploy_env }}{{ end }}"
    spec:
      project: {{ printf "%s-%s" .Values.appProjectName.db .Values.deploy_env | trimSuffix "-" }}
      source:
        repoURL: {{ .Values.repo }}
        targetRevision: main
        path: "{{ `{{path}}` }}"
      destination:
        server: {{ .Values.curCluster }}
        namespace: {{ printf "%s-%s" .Values.namespace.db .Values.deploy_env | trimSuffix "-"}}
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            {{- toYaml .Values.ambientLabels | nindent 12 }}
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: {{ .Values.syncRetry.limit }}
          backoff:
            duration: {{ .Values.syncRetry.backoffDuration }}
            factor: {{ .Values.syncRetry.backoffFactor }}
            maxDuration: {{ .Values.syncRetry.backoffMaxDuration }}
