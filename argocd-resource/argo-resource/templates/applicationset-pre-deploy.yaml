# jwt Secret을 auth Pod가 볼륨으로 마운트하므로, auth와 같은 네임스페이스(default)에 배포.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "pre-deploy-%s" .Values.deploy_env | trimSuffix "-" }}
  labels:
    {{- include "argo-resource.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  generators:
    - git:
        repoURL: {{ .Values.repo }}
        revision: main
        directories:
          - path: charts/pre-deploy/*
        allowEmpty: false
  template:
    metadata:
      name: "{{ `{{path.basename}}` }}{{ if .Values.deploy_env }}-{{ .Values.deploy_env }}{{ end }}"
    spec:
      project: {{ printf "%s-%s" .Values.appProjectName.preDeploy .Values.deploy_env | trimSuffix "-" }}
      source:
        repoURL: {{ .Values.repo }}
        targetRevision: main
        path: "{{ `{{path}}` }}"
        helm:
          valueFiles:
            - values.yaml
            {{- if eq .Values.deploy_env "prod"}}
            - values-prod.yaml
            {{- end}}
      destination:
        server: {{ .Values.curCluster }}
        namespace: {{ printf "%s-%s" .Values.namespace.service .Values.deploy_env | trimSuffix "-"}}
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            {{- toYaml .Values.ambientLabels | nindent 12 }}
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: {{ .Values.syncRetry.limit }}
          backoff:
            duration: {{ .Values.syncRetry.backoffDuration }}
            factor: {{ .Values.syncRetry.backoffFactor }}
            maxDuration: {{ .Values.syncRetry.backoffMaxDuration }}
